name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build frontend and cross-compile binaries
        # Inject the release tag (e.g. v1.2.3) as the build version; the
        # linker flag writes it into core/version.Version and the UI reads it
        # back from GET /v1/system/version.
        run: make release VERSION=${{ github.event.release.tag_name }}

      - name: Generate checksums
        working-directory: bin
        run: sha256sum nexa-* > checksums.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: bin/nexa-*
